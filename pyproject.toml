[project]
name = "pronunciation-assessment"
version = "0.1.0"
description = "Single-shot Azure pronunciation assessment (scripted / unscripted, en-US) with prosody output to JSON"
requires-python = ">=3.10,<3.14"
dependencies = [
    "azure-cognitiveservices-speech>=1.40.0",
    "sounddevice>=0.5.0",
    "python-dotenv>=1.0.0",
    "tk>=0.1.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]
